<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${course.title}">Course Details</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; }
        header { background-color: #d35400; color: white; padding: 20px; text-align: center; }
        .container { padding: 20px; max-width: 800px; margin: auto; background: white; margin-top: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        img { width: 100%; border-radius: 8px; }
        a.button { display: inline-block; margin-top: 20px; background-color: #27ae60; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; }
        a.button:hover { background-color: #2ecc71; }
        a.back { display: inline-block; margin-top: 20px; color: #d35400; text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <h1>Course Details</h1>
    </header>
    <div class="container" th:if="${course != null}">
        <img th:src="${course.imageUrl}" alt="Course Image">
        <h2 th:text="${course.title}">Title</h2>
        <p th:text="${course.description}">Description</p>
        <a href="#" class="button" onclick="alert('Enrollment feature coming soon!')">Enroll Now</a>
        <br>
        <a href="/" class="back">← Back to Courses</a>
    </div>
    <div class="container" th:if="${course == null}">
        <h2>Course not found!</h2>
        <a href="/" class="back">← Back to Courses</a>
    </div>
</body>
</html>
