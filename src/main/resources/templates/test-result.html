<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Result | Ashwamedh Gurukul</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="py-5 d-flex align-items-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 text-center">
                <div class="card p-5 shadow-lg border-0 rounded-4">
                    <h2 class="mb-4 fw-bold" style="color: var(--primary);">Test Completed!</h2>
                    
                    <h4 class="mb-3 text-muted" th:text="${course.title}">Course Title</h4>
                    
                    <div class="display-1 fw-bold mb-4" style="color: #27ae60;">
                        <span th:text="${score}">0</span> / <span th:text="${total}">5</span>
                    </div>
                    
                    <p class="lead mb-5" th:if="${score == total}">Excellent work! You have perfectly mastered this course.</p>
                    <p class="lead mb-5" th:if="${score < total && score > 0}">Good job! Keep learning and reviewing the materials.</p>
                    <p class="lead mb-5" th:if="${score == 0}">Don't worry, every master was once a beginner. Try studying the course again!</p>
                    
                    <a href="/dashboard" class="btn btn-outline-custom btn-lg">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
