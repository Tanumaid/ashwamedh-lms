<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Ashwamedh Gurukul</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-light bg-white shadow-sm mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold" style="color: #d35400;" href="/">Ashwamedh Gurukul</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow rounded-4 p-4">
                    <h3 class="text-center mb-4 fw-bold">Welcome Back</h3>
                    <div th:if="${param.error}" class="alert alert-danger text-center">Invalid email or password</div>
                    <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>
                    <div th:if="${param.registered}" class="alert alert-success text-center">Registration successful! Please login.</div>
                    <form action="/login" method="post">
                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <input type="email" name="email" class="form-control" placeholder="shishya@gurukul.org" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2" style="background-color:#d35400; border:none;">Log In</button>
                    </form>
                    <div class="text-center mt-3">
                        <small>Don't have an account? <a href="/register" style="color:#d35400;">Sign up</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
