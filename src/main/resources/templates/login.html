<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ashwamedh Gurukul</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="d-flex align-items-center py-4" style="min-height: 100vh; background: radial-gradient(circle at 50% 50%, rgba(211, 84, 0, 0.05), var(--bg-main));">
    <main class="w-100 m-auto">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="text-center mb-4">
                        <a href="/"><img src="https://ashwamedhgurukul.org/wp-content/uploads/2026/08/AshwamedhMainLogo-removebg-preview.png" alt="Logo" height="80"></a>
                    </div>
                    <div class="card p-5 shadow-lg border-0" style="background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);">
                        <h3 class="text-center mb-4 fw-bold" style="color: var(--primary);">Welcome Back</h3>
                        
                        <div th:if="${param.error}" class="alert alert-danger text-center bg-transparent border-danger text-danger">Invalid email or password</div>
                        <div th:if="${error}" class="alert alert-danger text-center bg-transparent border-danger text-danger" th:text="${error}"></div>
                        <div th:if="${param.registered}" class="alert alert-success text-center bg-transparent border-success text-success">Registration successful! Please login.</div>
                        
                        <form action="/login" method="post">
                            <div class="mb-3">
                                <label class="form-label">Email address</label>
                                <input type="email" name="email" class="form-control form-control-lg" placeholder="shishya@gurukul.org" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control form-control-lg" required>
                            </div>
                            <button type="submit" class="btn btn-custom btn-lg w-100 py-2">Log In</button>
                        </form>
                        <div class="text-center mt-4">
                            <small class="text-muted">Don't have an account? <a href="/register" style="color: var(--primary); font-weight: 600;">Sign up</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
