<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ashwamedh Gurukul LMS</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; }
        header { background-color: #d35400; color: white; padding: 20px; text-align: center; }
        .container { padding: 20px; max-width: 1200px; margin: auto; }
        .courses { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .card { background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; overflow: hidden; }
        .card img { width: 100%; height: 150px; object-fit: cover; }
        .card-content { padding: 15px; }
        .card h3 { margin-top: 0; }
        .card a { display: inline-block; margin-top: 10px; background-color: #e67e22; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; }
        .card a:hover { background-color: #d35400; }
    </style>
</head>
<body>
    <header>
        <h1>Ashwamedh Gurukul - Educational Revolution for Human Evolution</h1>
        <p>Digital Ashwamedh Gurukul Learning Management System</p>
    </header>
    <div class="container">
        <h2>Available Courses</h2>
        <div class="courses">
            <div class="card" th:each="course : ${courses}">
                <img th:src="${course.imageUrl}" alt="Course Image">
                <div class="card-content">
                    <h3 th:text="${course.title}">Course Title</h3>
                    <p th:text="${course.description}">Description</p>
                    <a th:href="@{'/course/' + ${course.id}}">View Details</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
