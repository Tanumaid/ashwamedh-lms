<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Ashwamedh Gurukul</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="d-flex align-items-center py-4" style="min-height: 100vh; background: radial-gradient(circle at 50% 50%, rgba(240, 140, 0, 0.1), var(--dark-bg));">
    <main class="w-100 m-auto">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="text-center mb-4">
                        <a href="/"><img src="https://ashwamedhgurukul.org/wp-content/uploads/2026/08/AshwamedhMainLogo-removebg-preview.png" alt="Logo" height="80"></a>
                    </div>
                    <div class="card p-5 shadow-lg border-0" style="background: rgba(30, 30, 30, 0.6); backdrop-filter: blur(10px);">
                        <h3 class="text-center mb-4 fw-bold" style="color: var(--primary);">Create an Account</h3>
                        
                        <div th:if="${param.error}" class="alert alert-danger text-center bg-transparent border-danger text-danger">Email already exists! Please login instead.</div>
                        
                        <form action="/register" method="post">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">First Name</label>
                                    <input type="text" name="firstName" class="form-control form-control-lg" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Last Name</label>
                                    <input type="text" name="lastName" class="form-control form-control-lg" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email address</label>
                                <input type="email" name="email" class="form-control form-control-lg" placeholder="seeker@gurukul.org" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control form-control-lg" required>
                            </div>
                            <button type="submit" class="btn btn-custom btn-lg w-100 py-2">Register</button>
                        </form>
                        <div class="text-center mt-4">
                            <small class="text-muted">Already have an account? <a href="/login" style="color: var(--primary); font-weight: 600;">Log in</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
