<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | Ashwamedh Gurukul</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <img src="https://ashwamedhgurukul.org/wp-content/uploads/2026/08/AshwamedhMainLogo-removebg-preview.png" alt="Ashwamedh Logo" class="me-2">
                <span class="fs-4">Ashwamedh Gurukul</span>
            </a>
            <div class="d-flex text-white align-items-center ms-auto">
                <i class="bi bi-person-circle fs-4 me-2" style="color: var(--primary);"></i>
                <span th:text="${user.name}">Student Name</span>
                <a href="/logout" class="btn btn-sm btn-outline-custom ms-3">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="fw-bold mb-4">My Dashboard</h2>
        
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 mb-4">
                <div class="list-group shadow-sm">
                    <a href="#" class="list-group-item list-group-item-action active" style="background-color: var(--primary); border-color: var(--primary);">
                        <i class="bi bi-journal-text me-2"></i> My Courses
                    </a>
                    <a href="#" class="list-group-item list-group-item-action text-white" style="background-color: var(--dark-surface); border-color: rgba(255,255,255,0.05);">
                        <i class="bi bi-award me-2 text-muted"></i> Certificates
                    </a>
                    <a href="#" class="list-group-item list-group-item-action text-white" style="background-color: var(--dark-surface); border-color: rgba(255,255,255,0.05);">
                        <i class="bi bi-gear me-2 text-muted"></i> Settings
                    </a>
                </div>
            </div>
            
            <!-- Main Content -->
            <div class="col-md-9">
                <div class="card p-4 mb-4">
                    <h4 class="mb-4" style="color: var(--primary);">Enrolled Courses</h4>
                    <div th:if="${enrollments.empty}" class="alert alert-info text-center bg-transparent border-info text-info">
                        You have not enrolled in any courses yet. <br><a href="/#courses" class="btn btn-outline-info mt-3">Browse courses</a>
                    </div>
                    <div class="table-responsive" th:unless="${enrollments.empty}">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Course Name</th>
                                    <th>Enrollment Date</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="enrollment : ${enrollments}">
                                    <td>
                                        <div class="d-flex align-items-center">
                                            <img th:src="${enrollment.course.imageUrl}" class="rounded me-3 border border-secondary" style="width: 60px; height: 60px; object-fit: cover;">
                                            <span class="fw-bold" th:text="${enrollment.course.title}">Course Title</span>
                                        </div>
                                    </td>
                                    <td>
                                        <span class="text-muted" th:text="${#temporals.format(enrollment.enrollmentDate, 'dd-MMM-yyyy')}">Date</span>
                                    </td>
                                    <td>
                                        <a th:href="@{'/course/' + ${enrollment.course.id}}" class="btn btn-sm btn-custom">Go to Course</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
