<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/">Ashwamedh Gurukul Portal</a>
            <div class="d-flex text-white align-items-center">
                <i class="bi bi-person-circle fs-4 me-2"></i>
                <span>Student</span>
                <a href="/" class="btn btn-sm btn-outline-light ms-3">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="fw-bold mb-4">My Dashboard</h2>
        
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 mb-4">
                <div class="list-group shadow-sm">
                    <a href="#" class="list-group-item list-group-item-action active" style="background-color:#d35400; border-color:#d35400;">
                        <i class="bi bi-journal-text me-2"></i> My Courses
                    </a>
                    <a href="#" class="list-group-item list-group-item-action">
                        <i class="bi bi-award me-2"></i> Certificates
                    </a>
                    <a href="#" class="list-group-item list-group-item-action">
                        <i class="bi bi-gear me-2"></i> Settings
                    </a>
                </div>
            </div>
            
            <!-- Main Content -->
            <div class="col-md-9">
                <div class="card border-0 shadow-sm p-4 mb-4">
                    <h4 class="mb-3">Enrolled Courses (Demo)</h4>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Course Name</th>
                                    <th>Progress</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="course, iterStat : ${courses}" th:if="${iterStat.index < 2}">
                                    <td>
                                        <div class="d-flex align-items-center">
                                            <img th:src="${course.imageUrl}" class="rounded me-3" style="width: 50px; height: 50px; object-fit: cover;">
                                            <span class="fw-bold" th:text="${course.title}">Course Title</span>
                                        </div>
                                    </td>
                                    <td style="width: 30%;">
                                        <div class="progress" style="height: 10px;">
                                            <div class="progress-bar bg-success" role="progressbar" style="width: 45%;"></div>
                                        </div>
                                        <small class="text-muted">45% Completed</small>
                                    </td>
                                    <td>
                                        <button class="btn btn-sm btn-primary">Resume</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
