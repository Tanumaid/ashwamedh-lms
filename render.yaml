databases:
  - name: ashwamedh-db
    databaseName: ashwamedh
    user: ashwamedh_user
    plan: free

services:
  - type: web
    name: ashwamedh-lms
    env: docker
    plan: free
    healthCheckPath: /login
    envVars:
      - key: DB_URL
        fromDatabase:
          name: ashwamedh-db
          property: connectionString
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DB_USERNAME
        fromDatabase:
          name: ashwamedh-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ashwamedh-db
          property: password
